<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قاسم</title>
<script src="config.js"></script>
<script src="keys.js"></script>
<script src="sec.js"></script>
<style>
:root{--bg:#0f1420;--card:#1a2236;--tx:#eef2ff;--mut:#8a94b0;--ac:#4f8cff;--r:#ff5a6a}
*{box-sizing:border-box}html,body{height:100%;overflow-x:hidden}
body{margin:auto;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:680px;width:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;cursor:pointer;border:0;color:var(--tx);background:none}
input,textarea,select{width:100%;min-width:0;background:var(--card);border:1px solid #2a3452;border-radius:12px;padding:10px 12px;color:var(--tx);font:inherit}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
h1{font-size:18px;margin:0}.ic{font-size:20px;padding:4px 8px}
#tabs{display:flex;gap:8px;padding:0 14px 8px}
.tb{flex:1;padding:9px;border-radius:12px;background:var(--card);color:var(--mut)}.tb.on{background:var(--ac);color:#fff}
.view{flex:1;display:none;flex-direction:column;min-height:0}.view.on{display:flex}
#msgs{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.m{padding:10px 13px;border-radius:16px;max-width:92%;line-height:1.65;font-size:15px;white-space:pre-wrap;word-break:break-word}
.u{background:var(--ac);align-self:flex-start}.a{background:var(--card);align-self:flex-end}
.m img{max-width:100%;max-height:160px;border-radius:10px;display:block;margin:0 0 6px}
pre{background:#0b0f19;border-radius:10px;padding:10px;overflow-x:auto;direction:ltr;text-align:left;font-size:13px;margin:6px 0}
code{background:#0b0f19;border-radius:5px;padding:1px 5px;direction:ltr}
#comp{padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
#modes{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.md{flex:1;padding:8px 4px;border-radius:10px;background:var(--card);color:var(--mut);font-size:13px}.md.on{background:#2b3f70;color:#fff;outline:1px solid var(--ac)}
#web{font-size:13px;color:var(--mut);padding:8px;border-radius:10px;background:var(--card)}#web.on{color:#fff;background:#1d6b52}
#th{display:flex;gap:6px;overflow-x:auto}#th div{position:relative;flex:none}#th img{height:56px;border-radius:8px}#th b{position:absolute;top:-4px;left:-4px;background:var(--r);border-radius:50%;width:18px;height:18px;font-size:11px;display:grid;place-items:center}
.row{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
#inp{max-height:110px;resize:none}
.rb{width:44px;height:44px;border-radius:50%;background:var(--ac);font-size:18px;flex:none}.rb.g{background:var(--card)}
.pad{padding:8px 14px 24px;overflow-y:auto}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.btn{background:var(--ac);border-radius:12px;padding:12px;width:100%;font-weight:600;margin-top:8px}.btn.s{background:#2a3452}
iframe{width:100%;height:380px;border:1px solid #2a3452;border-radius:12px;background:#fff;margin-top:8px}
.xi{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #2a3452}.xi span{flex:1}
#ov{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:8;padding-top:env(safe-area-inset-top,0px)}#ov.on{display:flex}
#ov iframe{flex:1;height:auto;margin:0;border-radius:0;border:0}
#set{position:fixed;inset:0;background:rgba(10,14,25,.97);display:none;flex-direction:column;justify-content:center;gap:8px;padding:24px;z-index:9}#set.on{display:flex}
small{color:var(--mut)}label{color:var(--mut);font-size:13px}
#cl{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:8;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 14px;overflow-y:auto}#cl.on{display:flex}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 0}.ci{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid #2a3452}.ci span{flex:1;cursor:pointer;line-height:1.5}.ci.cur span{color:var(--ac);font-weight:700}
.cp{font-size:12px;color:var(--mut);margin-top:6px;cursor:pointer}.md{font-size:12px!important;padding:8px 2px!important}
#modes{overflow-x:auto}.md{flex:none!important;min-width:62px;white-space:nowrap}#web{flex:none;white-space:nowrap}.rb{width:40px!important;height:40px!important;font-size:16px!important}
.rec{background:var(--r)!important;animation:pl 1s infinite}@keyframes pl{50%{transform:scale(1.12)}}
#lv{position:fixed;inset:0;background:#000;display:none;z-index:9}#lv.on{display:block}
#lvv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#lvt{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:linear-gradient(#000a,transparent)}
#lpn{position:absolute;left:12px;right:12px;bottom:120px;max-height:38%;overflow-y:auto;background:rgba(0,0,0,.6);border-radius:14px;padding:10px 12px;line-height:1.7;font-size:15px}
#lst{color:#9fb4ff;font-size:13px}#ltx{white-space:pre-wrap}
#lmic{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:50%;margin-left:-38px;width:76px;height:76px;border-radius:50%;background:var(--ac);font-size:32px}
#set{overflow-y:auto}#set>:first-child{margin-top:auto}#set>:last-child{margin-bottom:auto}
.cpr{display:flex;gap:16px;margin-top:6px}.cp{margin-top:0!important}#vo{flex:none;white-space:nowrap;font-size:13px;color:var(--mut);padding:8px;border-radius:10px;background:var(--card)}#vo.on{color:#fff;background:#1d6b52}
</style>
</head>
<body>
<header><div onclick="openList()" style="cursor:pointer;max-width:56%;overflow:hidden"><div style="font-size:18px;font-weight:700">🤖 قاسم <small style="font-weight:400">MOD0</small></div><small id="ct" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></small></div><div><button class="ic" onclick="newChat()">➕</button><button class="ic" onclick="openList()">📂</button><button class="ic" onclick="$('set').classList.add('on')">⚙️</button></div></header>
<div id="tabs"><button class="tb on" onclick="tab(0)">💬 المحادثات</button><button class="tb" onclick="tab(1)">🎥 مباشر</button><button class="tb" onclick="tab(2)">🪞 شخصيتي</button></div>

<div class="view on" id="v0">
  <div id="msgs"></div>
  <div id="comp">
    <div id="modes"><button class="md" data-m="fast">⚡ سريع</button><button class="md on" data-m="think">🧠 تفكير</button><button class="md" data-m="deep">🔬 أعمق</button><button class="md" data-m="ultra">🧬 جداً</button><button class="md" data-m="promax">👑 Pro Max</button><button id="web" onclick="cycleWeb()">🌐 تلقائي</button><button id="vo" onclick="toggleVo()">🔊 صوت</button></div>
    <div id="th"></div>
    <div class="row"><input type="file" id="pic" accept="image/*" multiple hidden>
      <button class="rb g" onclick="pic.click()">📎</button><input type="file" id="cam" accept="image/*" capture="environment" hidden><button class="rb g" onclick="cam.click()">📷</button><button class="rb g" id="dmic" onclick="dictate()">🎤</button><textarea id="inp" rows="1" placeholder="اسألني أي شي…"></textarea><button class="rb" id="snd" onclick="send()">➤</button></div>
  </div>
</div>

<div class="view" id="v1"><div class="pad">
  <div class="card"><b>🪞 تحليل شخصيتي</b><br><small>يقرأ رسائلك من <b>كل المحادثات</b> مع بعض، ويحلل أسلوبك واهتماماتك وطريقة تفكيرك. هو تقدير تقريبي للتأمل وليس تشخيصاً نفسياً، ورسائلك بتنرسل لخدمة الذكاء الاصطناعي مثل أي محادثة.</small>
    <div id="pai" style="margin:10px 0;font-size:14px"></div>
    <label>نوع التحليل</label><select id="pak"><option value="عام">تحليل شامل للشخصية</option><option value="سمات">سمات الشخصية (العوامل الخمسة تقريباً)</option><option value="تواصل">أسلوب التواصل والتعبير</option><option value="قوة">نقاط القوة والضعف مع نصائح</option><option value="اهتمامات">الاهتمامات والقيم والأهداف</option></select>
    <label>سؤال خاص (اختياري)</label><input id="paq" placeholder="مثلاً: شو نقاط ضعفي بالتواصل؟">
    <label>نص إضافي من مصدر ثاني (اختياري)</label><textarea id="pax" rows="3" placeholder="الصق رسائل أو كتابات تخصك…"></textarea>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--tx)"><input type="checkbox" id="pau" style="width:auto"> 🧬 تحليل عميق جداً (أبطأ، 3 مراحل)</label><button class="btn" id="pago" onclick="analyze()">🔍 حلّل</button></div>
  <div class="card" id="par" style="display:none"><div id="pat" style="line-height:1.75;font-size:15px;white-space:pre-wrap"></div><button class="btn s" onclick="copyPA()">📋 نسخ</button><br><small id="pad"></small></div>
</div></div>
<div id="cl"><div class="ch"><b>📂 المحادثات</b><button class="ic" onclick="$('cl').classList.remove('on')">✕</button></div><button class="btn" style="margin:0 0 8px" onclick="newChat();$('cl').classList.remove('on')">➕ محادثة جديدة</button><div class="row" style="margin:0 0 8px"><input id="cs" placeholder="🔎 ابحث بالمحادثات" oninput="renderList()"><button class="rb g" style="width:auto;padding:0 12px;border-radius:12px" onclick="copyChat()">📤</button></div><div id="cll"></div></div>

<div id="lock" style="position:fixed;inset:0;background:#0f1420;display:none;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:24px;z-index:20;color:#eef2ff"><div style="font-size:44px">🔒</div><b style="font-size:20px">قاسم</b><input id="lpin" type="password" inputmode="numeric" placeholder="الرمز" style="max-width:240px;text-align:center;background:#1a2236;border:1px solid #2a3452;border-radius:12px;padding:12px;color:#eef2ff;font:inherit"><button onclick="unlock()" style="max-width:240px;width:100%;background:#4f8cff;border:0;border-radius:12px;padding:12px;color:#fff;font:inherit;font-weight:600">فتح</button><small id="lerr" style="color:#ff5a6a"></small></div>
<div id="lv"><video id="lvv" autoplay playsinline muted></video>
 <div id="lvt"><button class="ic" onclick="closeLive()">✕</button><div><button class="ic" id="lsp" onclick="toggleSpeak()">🔊</button><button class="ic" onclick="flipCam()">🔄</button></div></div>
 <div id="lpn"><div id="lst"></div><div id="ltx"></div></div><button id="lmic" onclick="liveTalk()">🎤</button></div>
<div id="set"><label>مفتاح Groq الخاص فيك (اختياري — في مفتاح جاهز داخل التطبيق، وإذا حطيت مفتاحك يُستخدم بدله)</label><input id="key" placeholder="gsk_..." style="direction:ltr">
  <label>موديل الصور</label><input id="vm" style="direction:ltr"><label>تعليمات مخصصة للمساعد (اختياري)</label><textarea id="ci" rows="3" placeholder="مثلاً: جاوبني دايماً بالتفصيل، أنا مبرمج…"></textarea><label>🎙 صوت قاسم</label><select id="vc"><option value="fahad">فهد</option><option value="sultan">سلطان</option><option value="lulwa">لولوة</option><option value="noura">نورة</option></select>
  <button class="btn s" onclick="testVoice()">▶️ جرّب الصوت</button>
  <label>🔒 قفل التطبيق برمز (يشفّر بياناتك بالرمز؛ إذا نسيته ما في استرجاع)</label>
  <input id="pin" type="password" inputmode="numeric" placeholder="رمز جديد (4 خانات أو أكثر)">
  <div class="row"><button class="btn s" onclick="setPin()">تفعيل القفل</button><button class="btn s" onclick="rmPin()">إلغاء القفل</button></div>
  <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="pon" style="width:auto"> 🧩 قاسم يتكيّف مع أسلوبي تلقائياً</label>
  <label>ملف أسلوبي اللي تعلّمه قاسم (تقدر تعدله)</label><textarea id="ptx" rows="3"></textarea>
  <button class="btn s" onclick="prof.txt='';prof.n=0;$('ptx').value='';ls.set('prof',prof)">🗑 مسح ما تعلّمه</button>
  <button class="btn" onclick="saveSet()">حفظ</button></div>

<script type="text/plain" id="app-src">
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=SEC.ls;
const GROQ='https://api.groq.com/openai/v1',PU=String((window.APP&&APP.proxy)||'').replace(/\/+$/,'');
const DKEY=(()=>{try{return window.DK?String.fromCharCode(...DK.a.map((x,i)=>x^DK.b[i])):''}catch(e){return ''}})(),keyNow=()=>cfg.key||DKEY;
const usingProxy=()=>!!PU&&!keyNow(),B=()=>usingProxy()?PU:GROQ,ready=()=>!!(keyNow()||PU);
let cfg={key:'',vm:'qwen/qwen3.6-27b',...ls.get('acfg',{})},mode='think',web=false,imgs=[],hist=[],busy=false;
$('key').value=cfg.key;$('vm').value=cfg.vm;$('ci').value=cfg.ci||'';$('vc').value=cfg.voice||'fahad';
function saveSet(){cfg={key:$('key').value.trim(),vm:$('vm').value.trim()||'qwen/qwen3.6-27b',ci:$('ci').value.trim(),voice:$('vc').value};ls.set('acfg',cfg);prof.on=$('pon').checked;prof.txt=$('ptx').value.trim();ls.set('prof',prof);MODELS=null;$('set').classList.remove('on')}
function tab(i){if(i===1){openLive();return}const k=i===2;if(k)paInfo();$('v0').classList.toggle('on',!k);$('v1').classList.toggle('on',k);document.querySelectorAll('.tb').forEach((b,j)=>b.classList.toggle('on',j===(k?2:0)))}
document.querySelectorAll('.md').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.md').forEach(x=>x.classList.toggle('on',x===b))});
const hdr=()=>usingProxy()?{'Content-Type':'application/json'}:{'Content-Type':'application/json',Authorization:'Bearer '+keyNow()};

// ---------- عرض ----------
function md(s){s=esc(s.replace(/<think>[\s\S]*?(<\/think>|$)/g,''));
  return s.replace(/```\w*\n?([\s\S]*?)```/g,(m,c)=>`<pre>${c}</pre>`).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/^#{1,4} (.+)$/gm,'<b>$1</b>').replace(/^[-*] /gm,'• ')}
function bub(c,html){const d=document.createElement('div');d.className='m '+c;d.innerHTML=html;$('msgs').appendChild(d);$('msgs').scrollTop=1e9;return d}
function renderHist(){$('msgs').innerHTML='';if(!hist.length)bub('a','أهلين! أنا <b>قاسم</b> من شركة MOD0 🤝 اسألني أي شي، أو ارفق صورة 📎، أو تكلم 🎤، أو افتح 🎥 مباشر وأوريني اللي قدامك.');hist.forEach(h=>{const b=bub(h.role==='user'?'u':'a',md(h.content));if(h.role!=='user')addCp(b)})}
function addCp(b){b.insertAdjacentHTML('beforeend','<div class="cpr"><span class="cp" onclick="cpy(this)">📋 نسخ</span><span class="cp" onclick="readMsg(this)">🔊 اقرأ</span></div>')}
function msgText(el){const m=el.closest('.m').cloneNode(true);const r=m.querySelector('.cpr');if(r)r.remove();return m.innerText}
function readMsg(el){unlockAudio();if(speaking){stopSpeak();return}speak(msgText(el))}
function cpy(el){const t=msgText(el);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>el.textContent='✓ تم').catch(()=>prompt('انسخ:',t))}
function copyChat(){const t=hist.map(h=>(h.role==='user'?'أنا: ':'المساعد: ')+h.content).join('\n\n');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('تم نسخ المحادثة')).catch(()=>prompt('انسخ:',t))}
let chats=ls.get('chats',null),cid=ls.get('cid',null);
if(!chats){chats=[];const old=ls.get('chat',[]);if(old.length)chats.push({id:Date.now(),title:'محادثة سابقة',ts:Date.now(),msgs:old})}
const cur=()=>chats.find(c=>c.id===cid);
function saveChats(){ls.set('chats',chats);ls.set('cid',cid)}
function renderHead(){$('ct').textContent=cur()?cur().title:''}
function openChat(id){cid=id;hist=cur().msgs;saveChats();renderHist();renderHead()}
function newChat(){const c={id:Date.now(),title:'محادثة جديدة',ts:Date.now(),msgs:[]};chats.unshift(c);openChat(c.id);tab(0)}
function openList(){renderList();$('cl').classList.add('on')}
function renderList(){const q=($('cs').value||'').trim();chats.sort((a,b)=>b.ts-a.ts);$('cll').innerHTML=chats.filter(c=>!q||c.title.includes(q)||c.msgs.some(m=>m.content.includes(q))).map(c=>`<div class="ci ${c.id===cid?'cur':''}"><span onclick="pick(${c.id})">${esc(c.title)}<br><small>${new Date(c.ts).toLocaleDateString('ar')} • ${c.msgs.length} رسالة</small></span><button class="ic" onclick="renameChat(${c.id})">✏️</button><button class="ic" onclick="delChat(${c.id})">🗑</button></div>`).join('')}
function pick(id){openChat(id);$('cl').classList.remove('on');tab(0)}
function renameChat(id){const c=chats.find(x=>x.id===id),n=prompt('اسم المحادثة:',c.title);if(n){c.title=n.slice(0,40);saveChats();renderList();renderHead()}}
function delChat(id){if(!confirm('حذف المحادثة؟'))return;chats=chats.filter(c=>c.id!==id);
  if(!chats.length){newChat();renderList();return}if(id===cid)openChat(chats[0].id);else saveChats();renderList()}
if(!chats.length)newChat();else openChat(cid&&cur()?cid:chats[0].id);

// ---------- الصور ----------
$('pic').onchange=async e=>{for(const f of [...e.target.files].slice(0,4-imgs.length)){try{const b=await createImageBitmap(f),s=Math.min(1,1024/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);imgs.push(c.toDataURL('image/jpeg',.8))}catch(x){}}e.target.value='';thumbs()};
$('cam').onchange=$('pic').onchange;
function thumbs(){$('th').innerHTML=imgs.map((s,i)=>`<div><img src="${s}"><b onclick="imgs.splice(${i},1);thumbs()">✕</b></div>`).join('')}

// ---------- المحادثة ----------
const SYS={ultra:'',fast:'جاوب باختصار ومباشرة.',think:'فكّر قبل ما تجاوب وقدّم إجابة مرتبة وواضحة.',deep:'حلّل السؤال بعمق من عدة زوايا، وتحقق من إجابتك قبل كتابتها، وقدّم إجابة شاملة ومنظمة.'};
let ac=null,MODELS=null,wm=ls.get('wm','auto');
const isOss=m=>/gpt-oss/.test(m),is401=e=>/^401/.test(e);
const PP=(m,eff,max,ex)=>({temperature:.5,max_completion_tokens:max,...(isOss(m)?{reasoning_effort:eff,include_reasoning:false}:{}),...(ex||{})});
const EFF={fast:'low',think:'medium',deep:'high',ultra:'high',promax:'high'},MAXT={fast:2000,think:5000,deep:9000,ultra:9000,promax:9000};
const VX=[{},{reasoning_effort:'none'}];
const IDENT='أنت "قاسم"، مساعد ذكاء اصطناعي من شركة MOD0، داخل تطبيق جوال. تتكلم بالعربية بلهجة بسيطة وواضحة إلا إذا طلب المستخدم لغة ثانية. إذا سُئلت من أنت فقل: أنا قاسم، مساعد ذكاء اصطناعي من MOD0. وإذا سُئلت عن التقنية أو النموذج أو الشركة المزوّدة فقل إن هذه تفاصيل داخلية تخص MOD0 ولا يمكنك مشاركتها؛ لا تنسب نفسك لأي نموذج أو شركة بالاسم، لا بالتأكيد ولا بالنفي، ولا تختلق معلومات عن نفسك. معلوماتك المدربة قد تكون قديمة (قبل 2025 غالباً) فلا تفترض أن ما تعرفه هو الأحدث، وإذا لم تتوفر نتائج بحث حديثة فنبّه المستخدم أن المعلومة قد تكون قديمة. كن صادقاً ومفيداً ولا تجامل.';
async function post(body){const go=()=>fetch(B()+'/chat/completions',{method:'POST',headers:hdr(),signal:ac.signal,body:JSON.stringify(body)});
  let r=await go();if(r.status===429){const w=Math.min(25,+(r.headers.get('retry-after')||6)||6);await new Promise(z=>setTimeout(z,w*1000));r=await go()}return r}
async function errOf(r){try{const j=await r.json();return r.status+' '+String((j.error&&j.error.message)||'').slice(0,180)}catch(e){return String(r.status)}}

    const img=lvFrame||snapNow();if(!img)throw new Error('الكاميرا لسا ما جهزت');
    $('ltx').textContent='🗣 '+text+'\n\n';$('lst').textContent='👀 يشوف ويفكر…';
    const sys='أنت قاسم من شركة MOD0، مساعد صوتي بصري داخل تطبيق. المستخدم يوريك الكاميرا مباشرة ويسألك بصوته، فجاوب عما تراه في الصورة وعن سؤاله. اجعل جوابك جملاً قصيرة طبيعية بالعربية البسيطة مناسبة للقراءة بصوت عالي، بدون قوائم أو رموز أو markdown. لا تنسب نفسك لأي نموذج أو شركة بالاسم. التاريخ: '+new Date().toLocaleString('en-GB')+'.'+profTxt();
    const msgs=[{role:'system',content:sys},...lvHist,{role:'user',content:[{type:'text',text},{type:'image_url',image_url:{url:img}}]}];
    const ans=await streamTo(await visionList(),msgs,'low',1500,v=>{$('ltx').textContent='🗣 '+text+'\n\n'+v.replace(/<think>[\s\S]*?(<\/think>|$)/g,'')},VX);
    const clean=ans.replace(/<think>[\s\S]*?<\/think>/g,'').trim();
    lvHist.push({role:'user',content:text},{role:'assistant',content:clean});lvHist=lvHist.slice(-8);
    $('lst').textContent='✅ اضغط 🎤 لسؤال ثاني';if(lvSpeak)speak(clean,m=>{$('lst').textContent='🔇 '+m})}
  catch(e){if(e.name!=='AbortError')$('lst').textContent='خطأ: '+e.message}
  finally{lvBusy=false;lvFrame=null;$('lmic').classList.remove('rec')}}
async function dictate(){
  unlockAudio();
  if(dic){stopRec();return}
  if(!ready()){$('set').classList.add('on');return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('فعّل إذن المايك ('+e.name+')');return}
  dic=true;$('dmic').classList.add('rec');ac=new AbortController();$('inp').placeholder='🎤 أسمعك…';let text='';
  try{const r=await listenOnce(st);if(r.spoke){$('inp').placeholder='⏳ يفهم كلامك…';text=await stt(r.blob,r.ext)}}
  catch(e){if(e.name!=='AbortError')alert(e.message)}
  st.getTracks().forEach(t=>t.stop());dic=false;$('dmic').classList.remove('rec');$('inp').placeholder='اسألني أي شي…';
  if(text){$('inp').value=($('inp').value+' '+text).trim();send()}}
webBtn();

// ---------- صوت قاسم (Orpheus عربي سعودي، وإلا صوت الجهاز) ----------
const TTSA=document.createElement('audio');TTSA.setAttribute('playsinline','');document.body.appendChild(TTSA);
let voOn=ls.get('vo',true),ttsTok=0,speaking=false;
const SIL='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function unlockAudio(){try{TTSA.src=SIL;const q=TTSA.play();q&&q.catch(()=>{})}catch(e){}}
function voBtn(){$('vo').textContent=voOn?'🔊 صوت':'🔇 صامت';$('vo').className=voOn?'on':''}
function toggleVo(){voOn=!voOn;ls.set('vo',voOn);voBtn();if(!voOn)stopSpeak()}
function toast(m){const d=document.createElement('div');d.style.cssText='position:fixed;bottom:90px;left:12px;right:12px;background:#2a3452;color:#fff;padding:12px;border-radius:12px;z-index:30;font-size:14px;line-height:1.6';d.innerHTML=m;document.body.appendChild(d);setTimeout(()=>d.remove(),10000)}
function tclean(t){return t.replace(/<think>[\s\S]*?<\/think>/g,'').replace(/```[\s\S]*?```/g,' ').replace(/https?:\/\/\S+/g,' ').replace(/[*#`_>|~\[\]{}]/g,' ').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,' ').replace(/\s+/g,' ').trim()}
function chunks(t,max){max=max||180;const out=[];let cur='';for(const s of (t.match(/[^.!?؟\n]+[.!?؟\n]*/g)||[t])){
  if((cur+' '+s).trim().length>max){if(cur.trim())out.push(cur.trim());cur=s;while(cur.length>max){out.push(cur.slice(0,max));cur=cur.slice(max)}}else cur+=' '+s}
  if(cur.trim())out.push(cur.trim());return out}
async function ttsBlob(text){
  const body={model:'canopylabs/orpheus-arabic-saudi',voice:cfg.voice||'fahad',input:text,response_format:'wav'};
  const go=()=>fetch(B()+'/audio/speech',{method:'POST',headers:hdr(),body:JSON.stringify(body)});
  let r=await go();if(r.status===429){await new Promise(z=>setTimeout(z,Math.min(20,+r.headers.get('retry-after')||5)*1000));r=await go()}
  if(!r.ok)throw new Error(await errOf(r));return await r.blob()}
function playBlob(b){return new Promise((res,rej)=>{const u=URL.createObjectURL(b);
  TTSA.onended=()=>{URL.revokeObjectURL(u);res()};TTSA.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('تشغيل الصوت فشل'))};TTSA.src=u;const q=TTSA.play();q&&q.catch(rej)})}
function stopSpeak(){ttsTok++;speaking=false;try{TTSA.pause();TTSA.dispatchEvent(new Event('ended'))}catch(e){}try{speechSynthesis.cancel()}catch(e){}}
function browserSpeak(t){try{if(!window.speechSynthesis)return false;const u=new SpeechSynthesisUtterance(t.slice(0,900));u.lang='ar-SA';const v=(speechSynthesis.getVoices()||[]).find(x=>/^ar/i.test(x.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);return true}catch(e){return false}}
async function speak(text,onErr){
  const my=++ttsTok,t=tclean(text),parts=chunks(t).slice(0,12);if(!parts.length)return;
  speaking=true;
  try{
    let next=ttsBlob(parts[0]);
    for(let i=0;i<parts.length;i++){
      const b=await next;if(my!==ttsTok)return;
      next=i+1<parts.length?ttsBlob(parts[i+1]).catch(()=>null):null;
      await playBlob(b);if(my!==ttsTok)return;
      if(!next)break;
      if(i+1<parts.length&&!(next=await next)){break}
      const nb=next;next=Promise.resolve(nb)}
  }catch(e){
    if(my!==ttsTok)return;
    const hint=/^(400|403|404)/.test(e.message)?'<br>غالباً لازم توافق على شروط موديل <b>canopylabs/orpheus-arabic-saudi</b> من console.groq.com (مرة وحدة).':'';
    const used=browserSpeak(t);
    const msg='صوت قاسم ما اشتغل ('+esc(e.message)+')'+(used?'، استخدمت صوت الجهاز':'، وصوت الجهاز مو متوفر')+hint;
    onErr?onErr(msg.replace(/<[^>]+>/g,' ')):toast(msg)}
  if(my===ttsTok)speaking=false}
function testVoice(){unlockAudio();cfg.voice=$('vc').value;speak('أهلاً، أنا قاسم من إم أو دي صفر. هذا اختبار الصوت.')}
voBtn();
async function setPin(){const p=$('pin').value;if(p.length<4){alert('الرمز 4 خانات على الأقل');return}
  try{await SEC.setPin(p);$('pin').value='';alert('تم تفعيل القفل 🔒 وتشفير بياناتك بالرمز')}catch(e){alert('التشفير غير مدعوم في هذا المتصفح')}}
async function rmPin(){await SEC.clearPin();alert('تم إلغاء القفل (البيانات تبقى مشفرة بمفتاح الجهاز)')}

// ---------- قاسم يتعلم أسلوبك (على جهازك فقط) ----------
let prof={on:true,txt:'',n:0,...ls.get('prof',{})};$('pon').checked=prof.on;$('ptx').value=prof.txt;
const profTxt=()=>prof.on&&prof.txt?'\nأسلوب هذا المستخدم المفضل (كيّف طريقتك معه بلطف: اللهجة والطول والتنسيق والأمثلة، لكن لا تجامله ولا توافقه على خطأ لمجرد إرضائه): '+prof.txt:'';
const LP='حلّل أسلوب المستخدم في الكتابة وتفضيلاته من رسائله، وحدّث ملف تفضيلات قصير (أقل من 90 كلمة) بالعربية يصف فقط: اللهجة/اللغة، عفوي أم رسمي، تفضيل الطول (مختصر/مفصل)، تفضيل التنسيق (نقاط/فقرات/أمثلة)، مستوى خبرته في مواضيعه، اهتماماته الظاهرة، وكيف يحب أن يُخاطَب. ممنوع ذكر أي معلومات حساسة (صحة، دين، سياسة، مال، عرق، هوية، علاقات خاصة) أو أسماء أو أرقام. اكتب الملف فقط بدون مقدمة.';
async function learn(){if(!prof.on)return;prof.n=(prof.n||0)+1;ls.set('prof',prof);
  if(prof.n<3||(prof.n-3)%4)return;
  const ms=[];for(const c of [...chats].sort((a,b)=>b.ts-a.ts)){for(const m of c.msgs.slice().reverse())if(m.role==='user'&&m.content.length>3)ms.push(m.content.replace(/\s+/g,' ').slice(0,250));if(ms.length>=25)break}
  if(ms.length<3)return;
  const keep=ac;ac=new AbortController();
  const pr=callOnce(['openai/gpt-oss-20b'],[{role:'system',content:LP},{role:'user',content:'الملف الحالي: '+(prof.txt||'(فارغ)')+'\n\nآخر رسائل المستخدم:\n'+ms.map(x=>'- '+x).join('\n')}],'low',600);ac=keep;
  const t=await pr;if(t){prof.txt=t.slice(0,700);ls.set('prof',prof);$('ptx').value=prof.txt}}
</script>

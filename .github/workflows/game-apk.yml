name: Game APK
on:
  workflow_dispatch:
    inputs:
      slug: {required: true}
      name: {required: true}
permissions: {contents: write}
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SLUG: ${{ inputs.slug }}
      APPNAME: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - name: مفتاح التوقيع الثابت
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; fi
      - run: mkdir g && cp "games/$SLUG/index.html" g/index.html
      - run: npm init -y >/dev/null && npm i @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap init "$APPNAME" "com.qasim.$SLUG" --web-dir g
      - run: npx cap add android && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk game.apk
      - uses: softprops/action-gh-release@v2
        with: {tag_name: "${{ inputs.slug }}", files: game.apk}

<!--
 فكرة: لعبة ثعبان بسيطة (Snake) حيث يتحكم اللاعب بالثعبان لتناول الطعام.
 التحكم: لمس الشاشة لتغيير الاتجاه (سحب أو ضغط على الجوانب)، زر كتم الصوت.
 الفوز/الخسارة: تصطدم الحواف أو جسم الثعبان نفسه؛ النتيجة هي عدد الطعام المأكول.
 الشكل: رسومات Canvas بألوان هادئة، واجهة عربية RTL، مؤثرات صوتية خفيفة.
-->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لعبة الثعبان</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0d1117;color:#c9d1d9;font-family:Arial,Helvetica,sans-serif;touch-action:none;}
  #gameCanvas{display:block;background:#0d1117;}
  .overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(13,17,23,0.85);z-index:2;}
  #joystick{position:absolute;bottom:20px;left:20px;width:80px;height:80px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3;}
  #joystick .handle{width:40px;height:40px;background:#fff;border-radius:50%;transition:transform 0.2s;}
  .btn{padding:10px 20px;margin:10px;background:#238636;border:none;border-radius:5px;color:#fff;font-size:1.2rem;cursor:pointer;transition:transform 0.1s;}
  .btn:active{transform:scale(0.95);}
  #score{position:absolute;top:10px;right:10px;font-size:1.2rem;z-index:1;transition:transform 0.2s;}
  .pulse{animation: pulse 0.3s;}
  @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.3);}100%{transform:scale(1);}}
  #muteBtn{position:absolute;top:10px;left:10px;padding:5px;background:#21262d;border:none;border-radius:5px;color:#c9d1d9;cursor:pointer;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="joystick"><div class="handle"></div></div>

<div id="startScreen" class="overlay">
  <h1>ثعبان</h1>
  <button id="startBtn" class="btn">ابدأ اللعبة</button>
  <p>النتيجة الأعلى: <span id="highScore">0</span></p>
</div>

<div id="gameOverScreen" class="overlay" style="display:none;">
  <h1>انتهت اللعبة!</h1>
  <p>النتيجة: <span id="finalScore">0</span></p>
  <p>النتيجة الأعلى: <span id="bestScore">0</span></p>
  <button id="restartBtn" class="btn">إعادة</button>
</div>

<button id="muteBtn">🔊</button>
<div id="score">0</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  function resize(){
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.scale(dpr,dpr);
  }
  resize();
  window.addEventListener('resize', resize);
  document.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});

  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const muteBtn = document.getElementById('muteBtn');
  const scoreEl = document.getElementById('score');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const highScoreEl = document.getElementById('highScore');

  // Audio
  let audioCtx, gainNode, muted = false;
  function initAudio(){
    try{
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      gainNode = audioCtx.createGain();
      gainNode.connect(audioCtx.destination);
    }catch(e){}
  }
  initAudio();
  function beep(freq, dur){
    if(muted||!audioCtx)return;
    const osc = audioCtx.createOscillator();
    osc.frequency.value = freq;
    osc.connect(gainNode);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }
  muteBtn.addEventListener('click',()=>{muted=!muted; muteBtn.textContent=muted?'🔇':'🔊';});

  // Game variables
  const cellSize = 20;
  let cols, rows;
  let snake, direction, nextDirection;
  let food;
  let score = 0;
  let highScore = 0;
  let gameRunning = false;
  let lastRender = 0;
  const speed = 120; // ms per move

  // Load high score
  try{
    const hs = localStorage.getItem('snakeHighScore');
    highScore = hs?parseInt(hs):0;
  }catch(e){}
  highScoreEl.textContent = highScore;
  bestScoreEl.textContent = highScore;

  function initGrid(){
    cols = Math.floor(canvas.width / dpr / cellSize);
    rows = Math.floor(canvas.height / dpr / cellSize);
  }

  function resetGame(){
    initGrid();
    snake = [{x:Math.floor(cols/2), y:Math.floor(rows/2)}];
    direction = {x:1,y:0};
    nextDirection = direction;
    placeFood();
    score = 0;
    scoreEl.textContent = '0';
  }

  function placeFood(){
    let empty;
    do{
      empty = {x:Math.floor(Math.random()*cols), y:Math.floor(Math.random()*rows)};
    }while(snake.some(seg=>seg.x===empty.x && seg.y===empty.y));
    food = empty;
  }

  function startGame(){
    resetGame();
    startScreen.style.display='none';
    gameOverScreen.style.display='none';
    gameRunning = true;
    lastRender = performance.now();
    requestAnimationFrame(gameLoop);
  }

  function endGame(){
    gameRunning = false;
    finalScoreEl.textContent = score;
    if(score>highScore){
      highScore = score;
      try{localStorage.setItem('snakeHighScore',highScore);}catch(e){}
    }
    bestScoreEl.textContent = highScore;
    gameOverScreen.style.display='flex';
    beep(150,0.3);
  }

  function update(){
    direction = nextDirection;
    const head = {x:snake[0].x+direction.x, y:snake[0].y+direction.y};

    // wall collision
    if(head.x<0||head.x>=cols||head.y<0||head.y>=rows){
      endGame();return;
    }
    // self collision
    if(snake.some(seg=>seg.x===head.x && seg.y===head.y)){
      endGame();return;
    }

    snake.unshift(head);
    if(head.x===food.x && head.y===food.y){
      score++;
      scoreEl.textContent = score;
      scoreEl.classList.add('pulse');
      setTimeout(()=>scoreEl.classList.remove('pulse'),300);
      beep(400,0.1);
      placeFood();
    }else{
      snake.pop();
    }
  }

  function draw(){
    // خلفية متدرجة مع بعض الأشكال الدائرية العشوائية
    const grad = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
    grad.addColorStop(0, '#1e1e2e');
    grad.addColorStop(1, '#0d1117');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // رسم دوائر خلفية خفيفة
    for(let i=0;i<30;i++){
        ctx.beginPath();
        const radius = Math.random()*30+10;
        const x = Math.random()*canvas.width;
        const y = Math.random()*canvas.height;
        ctx.arc(x,y,radius,0,Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.03)';
        ctx.fill();
    }
    // طعام الثعبان
    ctx.fillStyle = '#58a6ff';
    ctx.fillRect(food.x*cellSize, food.y*cellSize, cellSize, cellSize);
    // جسم الثعبان
    ctx.fillStyle = '#f85149';
    snake.forEach(seg=>ctx.fillRect(seg.x*cellSize, seg.y*cellSize, cellSize, cellSize));
  }

  function gameLoop(timestamp){
    if(!gameRunning)return;
    if(timestamp - lastRender > speed){
      update();
      draw();
      lastRender = timestamp;
    }
    requestAnimationFrame(gameLoop);
  }

  // Circular joystick control
  const joystick = document.getElementById('joystick');
  const handle = joystick.querySelector('.handle');
  let joystickActive = false, startX, startY;

  joystick.addEventListener('touchstart', e=>{
    e.preventDefault();
    joystickActive = true;
    const t = e.touches[0];
    const rect = joystick.getBoundingClientRect();
    startX = rect.left + rect.width/2;
    startY = rect.top + rect.height/2;
    handle.style.transition = '0s';
  }, {passive:false});

  joystick.addEventListener('touchmove', e=>{
    if(!joystickActive) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    const angle = Math.atan2(dy, dx);
    const distance = Math.min(30, Math.hypot(dx, dy));
    handle.style.transform = `translate(${Math.cos(angle)*distance}px, ${Math.sin(angle)*distance}px)`;

    // Determine direction based on angle
    if(Math.abs(dx) > Math.abs(dy)){
      if(dx > 0 && direction.x !== -1) nextDirection = {x:1,y:0};
      else if(dx < 0 && direction.x !== 1) nextDirection = {x:-1,y:0};
    }else{
      if(dy > 0 && direction.y !== -1) nextDirection = {x:0,y:1};
      else if(dy < 0 && direction.y !== 1) nextDirection = {x:0,y:-1};
    }
  }, {passive:false});

  joystick.addEventListener('touchend', e=>{
    joystickActive = false;
    handle.style.transition = '0.2s';
    handle.style.transform = 'translate(0,0)';
  });

  // Keyboard fallback (for desktop testing)
  document.addEventListener('keydown', e=>{
    if(!gameRunning)return;
    switch(e.key){
      case 'ArrowUp':    if(direction.y!==1) nextDirection={x:0,y:-1}; break;
      case 'ArrowDown':  if(direction.y!==-1) nextDirection={x:0,y:1}; break;
      case 'ArrowLeft':  if(direction.x!==1) nextDirection={x:-1,y:0}; break;
      case 'ArrowRight': if(direction.x!==-1) nextDirection={x:1,y:0}; break;
    }
  });

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>

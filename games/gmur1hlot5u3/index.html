<!--
فكرة: لعبة ثعبان بواجهة بطاقات بانتو خفيفة مع تدرجات لونية.
تحكم: سحب لإتجاهات، أزرار بدء/إعادة/كتم داخل بطاقات.
فوز/خسارة: جمع الطعام لزيادة النقاط، تصادم مع الجدار أو الذات = خسارة.
شكل: RTL، بطاقات بظل وتدرج، رسومات SVG هندسية، صوتيات WebAudio.
مخزن: أعلى نتيجة تُحفظ في localStorage مع معالجة الأخطاء.
-->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>لعبة الثعبان</title>
<style>
  :root{
    --bg:#f5f7fa;
    --card:#ffffff;
    --primary:#4a90e2;
    --accent:#e94e77;
    --text:#333;
    --shadow:rgba(0,0,0,0.1);
  }
  body{
    margin:0;
    font-family:system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    min-height:100vh;
    overflow:hidden;
  }
  .card{
    background:var(--card);
    border-radius:12px;
    box-shadow:0 4px 12px var(--shadow);
    padding:1rem;
    margin:0.5rem;
    width:calc(100% - 1rem);
    max-width:420px;
    text-align:center;
  }
  .title{
    font-size:1.6rem;
    margin:0.5rem 0;
  }
  button{
    min-height:44px;
    min-width:44px;
    padding:0.6rem 1rem;
    margin:0.3rem;
    font-size:1rem;
    border:none;
    border-radius:8px;
    background:var(--primary);
    color:#fff;
    cursor:pointer;
    transition:background .2s;
  }
  button:hover{background:var(--accent);}
  #gameCanvas{
    touch-action:none;
    width:100%;
    height:auto;
    display:block;
    background:#e0e0e0;
    border-radius:8px;
  }
  #scoreBoard{
    font-size:1.2rem;
    margin-top:0.5rem;
  }
  #muteBtn{
    background:transparent;
    width:44px;
    height:44px;
    padding:0;
    position:absolute;
    top:1rem;
    left:1rem;
  }
  #muteIcon{
    width:100%;
    height:100%;
    fill:var(--primary);
  }
  .hidden{display:none;}
</style>
</head>
<body>
<div class="card" id="startScreen">
  <svg width="64" height="64" viewBox="0 0 64 64"><polygon points="24,16 48,32 24,48" fill="var(--primary)"/></svg>
  <h1 class="title">لعبة الثعبان</h1>
  <button id="startBtn">ابدأ</button>
</div>

<div class="card hidden" id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="scoreBoard">النتيجة: 0 | أعلى نتيجة: 0</div>
  <button id="restartBtn" class="hidden">إعادة</button>
  <button id="muteBtn"><svg id="muteIcon" viewBox="0 0 64 64"><path d="M20 24h-8v16h8l12 12V12z"/></svg></button>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const gameContainer = document.getElementById('gameContainer');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const scoreBoard = document.getElementById('scoreBoard');
  const muteBtn = document.getElementById('muteBtn');
  const muteIcon = document.getElementById('muteIcon');

  let muted = false;
  try{
    muted = JSON.parse(localStorage.getItem('snakeMuted'))||false;
  }catch(e){}
  updateMuteIcon();

  const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const sounds = {
    eat:()=>playTone(200,0.05),
    over:()=>playTone(80,0.3)
  };
  function playTone(freq,dur){
    if(muted) return;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.frequency.value=freq;
    osc.type='square';
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    osc.start();
    osc.stop(audioCtx.currentTime+dur);
  }
  muteBtn.addEventListener('click',()=>{ muted=!muted; updateMuteIcon(); try{localStorage.setItem('snakeMuted',JSON.stringify(muted));}catch(e){} });
  function updateMuteIcon(){
    muteIcon.innerHTML = muted ?
      '<path d="M20 24h-8v16h8l12 12V12zM48 32c0-5.5-3-10.2-7.5-12.6l-2.2 2.2c3.5 1.9 5.7 5.5 5.7 10.4s-2.2 8.5-5.7 10.4l2.2 2.2c4.5-2.4 7.5-7.1 7.5-12.6z"/>' :
      '<path d="M20 24h-8v16h8l12 12V12z"/>';
  }

  const gridSize = 20;
  let cellSize, cols, rows;
  let snake, direction, nextDirection, food, particles;
  let score=0, highScore=0;
  let speed=5; // cells per second
  let lastTime=0, acc=0;
  let gameOver=false;
  let shakeTime=0;

  function resize(){
    const size = Math.min(window.innerWidth, window.innerHeight) - 40;
    canvas.style.width = size+'px';
    canvas.style.height = size+'px';
    const dpr = window.devicePixelRatio||1;
    canvas.width = size*dpr;
    canvas.height = size*dpr;
    ctx.scale(dpr,dpr);
    cellSize = size / gridSize;
    cols = rows = gridSize;
  }
  window.addEventListener('resize',resize);
  resize();

  function initGame(){
    snake=[[Math.floor(cols/2),Math.floor(rows/2)]];
    direction=[0,-1];
    nextDirection=direction.slice();
    placeFood();
    particles=[];
    score=0;
    speed=5;
    gameOver=false;
    shakeTime=0;
    updateScore();
    restartBtn.classList.add('hidden');
    requestAnimationFrame(loop);
  }

  function placeFood(){
    let x,y;
    do{
      x=Math.floor(Math.random()*cols);
      y=Math.floor(Math.random()*rows);
    }while(snake.some(p=>p[0]===x && p[1]===y));
    food=[x,y];
  }

  function updateScore(){
    try{
      const stored=localStorage.getItem('snakeHighScore');
      highScore=stored?parseInt(stored):0;
    }catch(e){}
    if(score>highScore){
      highScore=score;
      try{localStorage.setItem('snakeHighScore',highScore.toString());}catch(e){}
    }
    scoreBoard.textContent=`النتيجة: ${score} | أعلى نتيجة: ${highScore}`;
  }

  function loop(timestamp){
    if(!lastTime) lastTime=timestamp;
    const delta=(timestamp-lastTime)/1000;
    lastTime=timestamp;
    if(gameOver){
      if(shakeTime>0){
        shakeTime-=delta;
        const dx=(Math.random()-0.5)*8;
        const dy=(Math.random()-0.5)*8;
        gameContainer.style.transform=`translate(${dx}px,${dy}px)`;
      }else{
        gameContainer.style.transform='';
      }
      return;
    }
    acc+=delta*speed;
    while(acc>=1){
      step();
      acc--;
    }
    draw();
    requestAnimationFrame(loop);
  }

  function step(){
    direction=nextDirection;
    const head=[snake[0][0]+direction[0], snake[0][1]+direction[1]];
    // wall collision
    if(head[0]<0||head[0]>=cols||head[1]<0||head[1]>=rows||snake.some(p=>p[0]===head[0]&&p[1]===head[1])){
      gameOver=true;
      sounds.over();
      shakeTime=0.5;
      restartBtn.classList.remove('hidden');
      return;
    }
    snake.unshift(head);
    // food
    if(head[0]===food[0] && head[1]===food[1]){
      score++;
      speed+=0.3; // increase difficulty
      sounds.eat();
      createParticles(head[0]*cellSize+cellSize/2, head[1]*cellSize+cellSize/2);
      placeFood();
      updateScore();
    }else{
      snake.pop();
    }
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // grid background
    ctx.fillStyle='#d0d0d0';
    ctx.fillRect(0,0,cols*cellSize,rows*cellSize);
    // food
    ctx.fillStyle=varColor('--accent');
    ctx.beginPath();
    ctx.arc(food[0]*cellSize+cellSize/2, food[1]*cellSize+cellSize/2, cellSize*0.4,0,Math.PI*2);
    ctx.fill();
    // snake
    ctx.fillStyle=varColor('--primary');
    snake.forEach((p,i)=>{
      ctx.fillRect(p[0]*cellSize, p[1]*cellSize, cellSize, cellSize);
    });
    // particles
    particles.forEach(p=>{
      ctx.fillStyle=`rgba(255,200,0,${p.life})`;
      ctx.fillRect(p.x-2,p.y-2,4,4);
    });
    particles = particles.filter(p=>{p.life-=0.02; p.x+=p.vx; p.y+=p.vy; return p.life>0;});
  }

  function varColor(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function createParticles(x,y){
    for(let i=0;i<12;i++){
      const angle=Math.random()*Math.PI*2;
      const speed=Math.random()*2+1;
      particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1});
    }
  }

  // touch controls
  let touchStartX=0, touchStartY=0;
  canvas.addEventListener('touchstart',e=>{ const t=e.touches[0]; touchStartX=t.clientX; touchStartY=t.clientY; });
  canvas.addEventListener('touchend',e=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-touchStartX;
    const dy=t.clientY-touchStartY;
    if(Math.abs(dx)>Math.abs(dy)){
      if(dx>30 && direction[0]!==-1) nextDirection=[1,0];
      else if(dx<-30 && direction[0]!==1) nextDirection=[-1,0];
    }else{
      if(dy>30 && direction[1]!==-1) nextDirection=[0,1];
      else if(dy<-30 && direction[1]!==1) nextDirection=[0,-1];
    }
  });

  startBtn.addEventListener('click',()=>{
    startScreen.classList.add('hidden');
    gameContainer.classList.remove('hidden');
    initGame();
  });
  restartBtn.addEventListener('click',()=>{ initGame(); });
})();
</script>
</body>
</html>
